# ============================================================
# Predictive Healthcare System — Docker Compose
# ============================================================
# Usage:
#   docker-compose up --build          # Start all services
#   docker-compose down                # Stop and remove
#   docker-compose logs -f backend     # Follow backend logs
# ============================================================

version: "3.9"

services:
  # ---- Backend API ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phs-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/phs.db
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production_to_64_random_chars}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=15
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
      - FRONTEND_URL=http://localhost:3000
      - DEBUG=false
      - ADMIN_EMAIL=admin@phs.local
      - ADMIN_PASSWORD=Admin@12345
    volumes:
      - backend-data:/app/data
      - ./ml/artifacts:/app/ml/artifacts:ro
      - ./knowledge_base:/app/knowledge_base:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---- Frontend (Nginx) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phs-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
    driver: local
